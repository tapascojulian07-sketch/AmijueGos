<!DOCTYPE html>
<!-- Define el tipo de documento como HTML5 y establece el idioma español -->
<html lang="es">
<!-- Sección de metadatos, configuración y enlaces a recursos externos -->
<head>
    <!-- Establece la codificación de caracteres a UTF-8 para admitir tildes y caracteres especiales -->
    <meta charset="UTF-8">
    <!-- Configura la escala y el diseño adaptable (responsive) para dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Define el título de la pestaña del navegador para la sección de ofertas -->
    <title>Amijuegos - Ofertas</title>
    <!-- Vincula la hoja de estilos CSS externa compartida -->
    <link rel="stylesheet" href="../styles/style.css">
</head>
<!-- Cuerpo principal de la página -->
<body>
    <!-- Contenedor principal de la interfaz con clase de ocultamiento inicial -->
    <div class="oculto" id="oculto">
        <!-- Encabezado superior con el logotipo institucional y acceso a opciones -->
        <header>
            <!-- Logotipo de la plataforma -->
            <img src="../imagenes/image_1_1776972191434-removebg-preview.png" alt="logo" class="logo">
            <!-- Botón de menú desplegable o de tres puntos que redirige a la vista de opciones -->
            <button type="button" class="options" onclick="window.location.href='Options.html'">⁝</button>
        </header>
        <!-- Sección principal de contenido para las ofertas -->
        <main>
            <!-- Barra de navegación superior para moverse entre las vistas de la aplicación -->
            <nav class="menu">
                <button onclick="window.location.href='../index.html'">Tienda</button>
                <button onclick="window.location.href='biblioteca.html'">Biblioteca</button>
                <button onclick="window.location.href='ofertas.html'">Ofertas</button>
                <!-- Botón de acceso al panel de administración (oculto por defecto según los permisos del usuario) -->
                <button id="btn-admin" onclick="window.location.href='../admin/admin.html'" style="display: none; background-color: #d9534f; color: white;">Panel Admin</button>
            </nav>

            <!-- Encabezado de la sección de ofertas especiales -->
            <div style="text-align: center; padding: 20px;">
                <h2>Ofertas Especiales</h2>
            </div>

            <!-- Contenedor dinámico que será rellenado por el script con las ofertas disponibles -->
            <div id="contenido-ofertas"></div>

            <!-- Vista de detalles del juego en oferta (oculta por defecto hasta que se selecciona un artículo) -->
            <div id="detalles-juego" style="display: none; max-width: 600px; margin: 20px auto; background: rgba(0,0,0,0.3); padding: 25px; border-radius: 12px; color: white; text-align: center;">
                <!-- Botón para cerrar los detalles y volver a la vista principal -->
                <button onclick="document.getElementById('detalles-juego').style.display='none'; document.getElementById('contenido').style.display='block';" style="padding: 8px 15px; background: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 15px;">← Volver a la Tienda</button>
                
                <!-- Elementos dinámicos que muestran la información detallada del juego seleccionado -->
                <h2 id="detalle-nombre" style="margin-top: 10px;"></h2>
                <img id="detalle-imagen" src="" alt="Imagen del juego" style="max-width: 100%; height: auto; border-radius: 8px; margin: 15px 0;">
                <p id="detalle-descripcion" style="font-size: 16px; margin-bottom: 15px;"></p>
                <p id="detalle-precio" style="font-size: 18px; font-weight: bold; color: #5cb85c; margin-bottom: 20px;"></p>
                <!-- Botón para confirmar la compra del juego actual con precio de oferta -->
                <button onclick="comprarJuegoActual(
                        document.getElementById('detalle-nombre').textContent,
                        document.getElementById('detalle-descripcion').textContent,
                        document.getElementById('detalle-imagen').src,
                        document.getElementById('detalle-precio').textContent
                )" style="padding: 10px 25px; background: #5cb85c; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Confirmar Compra</button>
            </div>
        </main>
    </div>

    <!-- Script modular específico para gestionar la lógica y renderizado de la sección de ofertas -->
    <script type="module" src="../javascript/ofertas.js"></script>
</body>
</html>
